<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TenantHub - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
    <div class="brand">
        <div class="brand-logo">
            <div class="icon">🏢</div>
            TenantHub
        </div>
        <h2>One platform, every company in its own space.</h2>
        <p>Sign in to your company workspace. Your data stays inside your company only.</p>
        <div class="features">
            <span class="badge">🔐 Secure login</span>
            <span class="badge">🏢 Multi-company</span>
            <span class="badge">🎫 JWT tokens</span>
        </div>
    </div>

    <div class="form-side">
        <div class="card-box">
            <h1 class="gradient-text">Welcome back</h1>
            <p class="subtitle" id="subtitle">Log in to your company account</p>

            <!-- Choose who is logging in -->
            <div class="tabs">
                <button type="button" class="tab active" id="userTab">User</button>
                <button type="button" class="tab" id="adminTab">Admin</button>
            </div>

            <div class="message" id="message"></div>

            <form id="loginForm">
                <!-- Only users need a company. It is hidden for admins. -->
                <div class="field" id="companyField">
                    <label class="label-primary" for="companySlug">Company</label>
                    <input type="text" id="companySlug" placeholder="e.g. orange-company">
                    <div class="hint">Your company's short name (slug)</div>
                </div>

                <div class="field">
                    <label class="label-pink" for="email">Email</label>
                    <input type="email" id="email" placeholder="you@example.com" required>
                </div>

                <div class="field">
                    <label class="label-orange" for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn" id="loginButton">Log in</button>
            </form>
        </div>
    </div>

    <script>
        // "User" or "Admin": decides which API we call
        let mode = "User";

        const userTab = document.getElementById("userTab");
        const adminTab = document.getElementById("adminTab");
        const companyField = document.getElementById("companyField");
        const companyInput = document.getElementById("companySlug");
        const subtitle = document.getElementById("subtitle");
        const message = document.getElementById("message");
        const loginButton = document.getElementById("loginButton");

        // Switch between the User and Admin tabs
        function setMode(newMode) {
            mode = newMode;
            userTab.classList.toggle("active", mode === "User");
            adminTab.classList.toggle("active", mode === "Admin");

            // Admins don't belong to a company, so hide the company field
            companyField.classList.toggle("hidden", mode === "Admin");
            subtitle.textContent = mode === "Admin"
                ? "Log in as the system admin"
                : "Log in to your company account";
            message.className = "message";
        }

        userTab.addEventListener("click", () => setMode("User"));
        adminTab.addEventListener("click", () => setMode("Admin"));

        document.getElementById("loginForm").addEventListener("submit", async (event) => {
            // Stop the form from reloading the page
            event.preventDefault();
            message.className = "message";

            if (mode === "User" && companyInput.value.trim() === "") {
                message.textContent = "Please enter your company";
                message.className = "message error";
                return;
            }

            loginButton.disabled = true;
            loginButton.textContent = "Logging in...";

            // Pick the right API and body for each mode
            const url = mode === "Admin" ? "/auth/admin/login" : "/auth/user/login";
            const body = {
                email: document.getElementById("email").value,
                password: document.getElementById("password").value
            };
            if (mode === "User") {
                body.companySlug = companyInput.value.trim();
            }

            const response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body)
            });

            if (!response.ok) {
                message.textContent = "Invalid email or password";
                message.className = "message error";
                loginButton.disabled = false;
                loginButton.textContent = "Log in";
                return;
            }

            // Save the token and the role, then go to the right page
            const data = await response.json();
            sessionStorage.setItem("token", data.token);
            sessionStorage.setItem("role", mode);

            window.location.href = mode === "Admin" ? "admin.html" : "home.html";
        });
    </script>
</body>
</html>
