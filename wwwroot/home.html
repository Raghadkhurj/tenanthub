<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TenantHub - Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="app-page">
    <header class="topbar">
        <div class="logo">
            <div class="icon">🏢</div>
            TenantHub
            <span class="role-pill">User</span>
        </div>
        <button class="logout" id="logoutButton">Log out</button>
    </header>

    <main>
        <h1>Welcome to <span class="gradient-text" id="companyTitle">your company</span></h1>
        <p class="subtitle">You are logged in. You can only see your own company's data.</p>

        <div class="info-cards">
            <div class="info-card">
                <label class="label-primary">Email</label>
                <div class="value" id="email">...</div>
            </div>
            <div class="info-card">
                <label class="label-pink">Company</label>
                <div class="value" id="companyName">...</div>
            </div>
            <div class="info-card">
                <label class="label-orange">Company slug</label>
                <div class="value" id="companySlug">...</div>
            </div>
            <div class="info-card">
                <label class="label-teal">Member since</label>
                <div class="value" id="createdDate">...</div>
            </div>
        </div>
    </main>

    <script>
        const token = sessionStorage.getItem("token");
        const role = sessionStorage.getItem("role");

        // Only logged-in users can see this page
        if (!token || role !== "User") {
            window.location.href = "login.html";
        }

        // Log out: forget the token and go back to login
        document.getElementById("logoutButton").addEventListener("click", () => {
            sessionStorage.clear();
            window.location.href = "login.html";
        });

        // Ask our API who the current user is, using the token
        async function loadCurrentUser() {
            const response = await fetch("/current-user", {
                headers: { "Authorization": "Bearer " + token }
            });

            // Token expired or invalid: go back to login
            if (!response.ok) {
                sessionStorage.clear();
                window.location.href = "login.html";
                return;
            }

            const user = await response.json();

            document.getElementById("companyTitle").textContent = user.tenant.name;
            document.getElementById("email").textContent = user.email;
            document.getElementById("companyName").textContent = user.tenant.name;
            document.getElementById("companySlug").textContent = user.tenant.slug;
            document.getElementById("createdDate").textContent =
                new Date(user.createdDate).toLocaleDateString();
        }

        if (token && role === "User") {
            loadCurrentUser();
        }
    </script>
</body>
</html>
