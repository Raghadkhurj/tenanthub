<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TenantHub - Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="app-page">
    <header class="topbar">
        <div class="logo">
            <div class="icon">🏢</div>
            TenantHub
            <span class="role-pill">Admin</span>
        </div>
        <button class="logout" id="logoutButton">Log out</button>
    </header>

    <main>
        <h1>Admin <span class="gradient-text">dashboard</span></h1>
        <p class="subtitle">Create users and add them to a company.</p>

        <div class="admin-layout">
            <!-- Create user form -->
            <div class="card-box">
                <h2>Create a user</h2>

                <div class="message" id="message"></div>

                <form id="createUserForm">
                    <div class="field">
                        <label class="label-primary" for="companySlug">Company</label>
                        <select id="companySlug" required>
                            <option value="">Loading companies...</option>
                        </select>
                    </div>

                    <div class="field">
                        <label class="label-pink" for="email">Email</label>
                        <input type="email" id="email" placeholder="user@example.com" required>
                    </div>

                    <div class="field">
                        <label class="label-orange" for="password">Password</label>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn" id="createButton">Create user</button>
                </form>
            </div>

            <!-- Users created in this session -->
            <div class="card-box">
                <h2>Created now</h2>
                <p class="empty" id="emptyText">No users created yet.</p>
                <table id="usersTable" class="hidden">
                    <thead>
                        <tr>
                            <th>Id</th>
                            <th>Email</th>
                            <th>Company</th>
                        </tr>
                    </thead>
                    <tbody id="usersBody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const token = sessionStorage.getItem("token");
        const role = sessionStorage.getItem("role");

        // Only the admin can see this page
        if (!token || role !== "Admin") {
            window.location.href = "login.html";
        }

        const message = document.getElementById("message");
        const companySelect = document.getElementById("companySlug");
        const createButton = document.getElementById("createButton");

        // Company id -> company name, to show names in the table
        const companyNames = {};

        // Log out: forget the token and go back to login
        document.getElementById("logoutButton").addEventListener("click", () => {
            sessionStorage.clear();
            window.location.href = "login.html";
        });

        // If the token is expired or not allowed, go back to login
        function handleAuthError(response) {
            if (response.status === 401 || response.status === 403) {
                sessionStorage.clear();
                window.location.href = "login.html";
                return true;
            }
            return false;
        }

        // Fill the company dropdown from GET /tenants
        async function loadCompanies() {
            const response = await fetch("/tenants", {
                headers: { "Authorization": "Bearer " + token }
            });

            if (handleAuthError(response)) return;

            const companies = await response.json();
            companySelect.innerHTML = '<option value="">Choose a company</option>';

            companies.forEach(company => {
                companyNames[company.id] = company.name;
                const option = document.createElement("option");
                option.value = company.slug;
                option.textContent = company.name;
                companySelect.appendChild(option);
            });
        }

        // Add a new row to the "Created now" table
        function addUserToTable(user) {
            document.getElementById("emptyText").classList.add("hidden");
            document.getElementById("usersTable").classList.remove("hidden");

            const row = document.createElement("tr");
            [user.id, user.email, companyNames[user.tenantId] || user.tenantId].forEach(value => {
                const cell = document.createElement("td");
                cell.textContent = value;
                row.appendChild(cell);
            });
            document.getElementById("usersBody").prepend(row);
        }

        // Create a user with POST /users
        document.getElementById("createUserForm").addEventListener("submit", async (event) => {
            event.preventDefault();
            message.className = "message";

            createButton.disabled = true;
            createButton.textContent = "Creating...";

            const response = await fetch("/users", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + token
                },
                body: JSON.stringify({
                    email: document.getElementById("email").value,
                    password: document.getElementById("password").value,
                    companySlug: companySelect.value
                })
            });

            createButton.disabled = false;
            createButton.textContent = "Create user";

            if (handleAuthError(response)) return;

            if (!response.ok) {
                // 400 = company not found, 409 = email already in this company
                message.textContent = await response.text();
                message.className = "message error";
                return;
            }

            const user = await response.json();
            message.textContent = "User created: " + user.email;
            message.className = "message success";
            addUserToTable(user);

            // Clear the email and password for the next user
            document.getElementById("email").value = "";
            document.getElementById("password").value = "";
        });

        if (token && role === "Admin") {
            loadCompanies();
        }
    </script>
</body>
</html>
